name: Deploy to EC2
on:
  push:
    branches: [ main ]  # only run this when i push to main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # fresh github runner every time

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # pull my repo onto the runner

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PAT }}  # this is a PAT not my actual pw

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .  # dockerfile is in root
        push: true  # push it, don't just build
        # latest = always current, sha tag = pinned version i can roll back to
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/easyborder-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/easyborder-backend:${{ github.sha }}

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3  # sshs into ec2 and runs my script
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "🚀 pulling latest image"
          cd /home/ubuntu/easyborder  # where my compose file + .env.production live
          # pull the new image BEFORE running migrations or restarting anything
          docker compose pull backend

          # spin up a throwaway container just to run the migration against RDS
          echo "🗄️ running database migrations"
          docker compose run --rm backend npx prisma migrate deploy

          # ok now actually swap the live container to the new image
          echo "♻️ restarting backend with new image"
          docker compose up -d --no-deps backend  # no-deps so nginx doesn't restart too

          echo "🧹 cleaning up old images"
          docker image prune -f  # keep ec2 disk from filling up over time

          echo "✅ deployment complete"
          docker ps | grep easyborder-backend  # eyeball check that it's actually running
