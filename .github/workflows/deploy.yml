name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PAT }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/easyborder-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/easyborder-backend:${{ github.sha }}
          
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "🚀 pulling latest image"
          # navigate to easyborder folder where docker-compose.yml lives
          cd /home/ubuntu/easyborder
          # --no-deps: only restarts backend container, leaves nginx untouched
          # --pull always: pulls latest image from Docker Hub automatically
          docker compose up -d --no-deps --pull always backend
          echo "🧹 cleaning up old images"
          docker image prune -f
          echo "✅ deployment complete"
          docker ps | grep easyborder-backend