# pnpm 12 build script allowlist (replaces onlyBuiltDependencies from pnpm <11)
# explicitly approve packages that need to run install/postinstall scripts
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  "@swc/core": true
  esbuild: true
  "@parcel/watcher": true
  unrs-resolver: true
