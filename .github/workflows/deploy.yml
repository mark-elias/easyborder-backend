name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PAT }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/easyborder-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/easyborder-backend:${{ github.sha }}
          
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "🚀 pulling latest image"
          cd /home/ubuntu/easyborder  # go to where docker-compose.yml + .env.production live
          # 🐘 pull the fresh image first, before touching migrations or the running container
          docker compose pull backend

          # 🐘 spin up a throwaway container from the new image just to run migrations against RDS
          echo "🗄️ running database migrations"
          docker compose run --rm backend npx prisma migrate deploy

          # 🐘 now actually swap the live backend container to the new image (pull already happened above)
          echo "♻️ restarting backend with new image"
          docker compose up -d --no-deps backend  # --no-deps = don't touch nginx or other services

          echo "🧹 cleaning up old images"
          docker image prune -f  # clears out old dangling images so EC2 disk doesn't fill up

          echo "✅ deployment complete"
          docker ps | grep easyborder-backend  # quick visual check the new container is actually up
