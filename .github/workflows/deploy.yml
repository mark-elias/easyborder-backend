name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/easyborder-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/easyborder-backend:${{ github.sha }}
          
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "🐳 pulling image"
          docker pull ${{ secrets.DOCKER_USERNAME }}/easyborder-backend:latest
          echo "🐳 stopping existing container"
          docker stop easyborder-backend || true
          docker rm easyborder-backend || true
          echo "🐳 starting new container"
          docker run -d \
            --name easyborder-backend \
            -p 3001:3001 \
            --env-file /home/ubuntu/.env.production \
            --restart unless-stopped \
            ${{ secrets.DOCKER_USERNAME }}/easyborder-backend:latest

          echo "🐳 cleaning up old images"
          docker image prune -f

          echo "✅ deployment complete"
          docker ps | grep easyborder-backend
        